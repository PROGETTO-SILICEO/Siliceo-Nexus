[package]
name = "beellama-switcher"
version = "0.1.0"
edition = "2021"
authors = ["Nova & Alfonso Riva <alforiva1970@gmail.com>"]
description = "Zero-GC Rust Micro-Daemon & Model Switcher for BeeLlama / llama.cpp TurboQuant Inference Node"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1.0"
